[package]
name="hedwig-desktop"
version="0.1.0"
edition="2024"
license="AGPL-3.0-only"

[build-dependencies]
png="0.18"
tauri-build= {version="2.5",features= [] }

[dependencies]
anyhow="1"
chrono= {version="0.4",features= ["serde"] }
hedwig-agent= {path="../../crates/hedwig-agent"}
hedwig-client= {path="../../crates/hedwig-client"}
hedwig-core= {path="../../crates/hedwig-core"}
keyring="4.2"
notify="8.2"
serde= {version="1",features= ["derive"] }
serde_json="1"
tauri= {version="2.11",features= ["tray-icon"] }
tauri-plugin-autostart="2.5"
tauri-plugin-dialog="2.7"
tokio= {version="1",features= ["sync", "time"] }
uuid= {version="1",features= ["v4", "serde"] }
walkdir="2"

[target.'cfg(target_os="linux")'.dependencies]
hedwig-mount= {path="../../crates/hedwig-mount"}

[target.'cfg(windows)'.dependencies]
hedwig-files-windows= {path="../../crates/hedwig-files-windows"}

[features]
custom-protocol= ["tauri/custom-protocol"]
