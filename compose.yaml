services:
  hedwig:
    build:
      context: .
      dockerfile: Containerfile
    image: hedwig:0.1.0-dev
    restart: unless-stopped
    init: true
    environment:
      HEDWIG_DATA_DIR: /var/lib/hedwig
      HEDWIG_WEB_DIR: /opt/hedwig/web
      HEDWIG_LISTEN: 0.0.0.0:8080
      HEDWIG_BACKUP_DIR: /var/backups/hedwig
      HEDWIG_BACKUP_INTERVAL_HOURS: 24
      HEDWIG_BACKUP_KEEP: 14
      # Optional: HEDWIG_MIRROR_DIR: /var/mirror/hedwig
      # Optional: HEDWIG_MIRROR_INTERVAL_MINUTES: 15
      RUST_LOG: hedwig_server=info,tower_http=info
    volumes:
      - ./data:/var/lib/hedwig
      - ./backups:/var/backups/hedwig
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/hedwigctl", "--database", "/var/lib/hedwig/metadata.db", "setup-status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
